name: Build and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

# Allow one concurrent deployment
concurrency:
  group: 'deploy'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Pull static assets
        run: npm run assets:pull
      - run: npm run build
      #- run: npm run rename_index_files
      - name: Install semantic-release
        # Both majors pinned together: the notes generator of semantic-release 25
        # renders the conventionalcommits preset up to major 9 only. semantic-release
        # 26 depends on preset 10 itself, so the preset leaves this line when the
        # pin moves to 26.
        run: |
          npm install --no-save semantic-release@25 conventional-changelog-conventionalcommits@9
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
